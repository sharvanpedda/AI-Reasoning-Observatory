# Runs the frontend and backend as two entirely separate services/
# containers — no shared filesystem, no shared process, no shared
# environment. The frontend container never has ANTHROPIC_API_KEY in
# its environment at all; only backend.env does. This is the
# containerized equivalent of "frontend and backend in separate
# frames" (see DEPLOYMENT.md).
#
# Usage:
#   cp backend/.env.example backend.env   # then fill in ANTHROPIC_API_KEY
#   docker compose up --build

services:
  backend:
    build:
      context: ./backend
    env_file:
      - backend.env
    environment:
      # The frontend's own origin, so CORS accepts it. Override in
      # backend.env for a real deployment.
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    networks:
      - observatory
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time — this is a public URL, not a secret.
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - observatory
    restart: unless-stopped

networks:
  observatory:
    driver: bridge
