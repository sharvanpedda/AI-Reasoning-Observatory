# Render (render.com) blueprint for the backend as its own web service,
# on its own origin, with its own environment — no filesystem or
# process is ever shared with the frontend deployment.
#
# Usage: connect this repo on Render, pick "backend" as the root
# directory, and Render will pick up this file automatically, or
# create the service manually using these settings.
services:
  - type: web
    name: ai-reasoning-observatory-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard — never commit this
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.vercel.app
      - key: TRUSTED_HOSTS
        value: ai-reasoning-observatory-api.onrender.com
      - key: DOCS_ENABLED
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
